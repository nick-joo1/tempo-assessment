name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag review-flow-insights .
      - name: Start the container and wait for it to report ready
        run: |
          docker run --detach --name app --publish 3000:3000 --env GITHUB_TOKEN=placeholder review-flow-insights
          for attempt in $(seq 1 20); do
            curl --silent --fail http://127.0.0.1:3000/readyz && exit 0
            sleep 1
          done
          docker logs app
          exit 1
